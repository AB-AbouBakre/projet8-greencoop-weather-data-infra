version: 2

models:
  - name: dim_weather_stations
    description: "Dimension des stations météorologiques provenant 
d'InfoClimat et Weather Underground."
    columns:
      - name: station_id
        description: "Identifiant unique de la station météo."
        tests:
          - not_null
          - unique

      - name: station_name
        description: "Nom de la station météo."
        tests:
          - not_null

      - name: source_system
        description: "Système source : infoclimat ou weather_underground."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['infoclimat', 'weather_underground']

  - name: fact_weather_observations
    description: "Table de faits contenant les observations 
météorologiques standardisées."
    columns:
      - name: station_id
        description: "Identifiant de la station météo."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_weather_stations')
                field: station_id

      - name: measured_at_utc
        description: "Date et heure de la mesure météo."
        tests:
          - not_null

      - name: source_system
        description: "Système source de l'observation."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['infoclimat', 'weather_underground']

      - name: humidity_pct
        description: "Humidité relative en pourcentage."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
